<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Degen Radio</title>
<meta name="description" content="24/7 live roast commentary on what famous memecoin traders are buying and dumping.">
<meta property="og:title" content="Degen Radio">
<meta property="og:description" content="Live, brutal commentary on famous memecoin traders' real trades.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: a late-night broadcast studio. The live caption is the hero; transcript log left, trade wire and today's board right. */
:root {
  --studio: #120c0e;      /* page */
  --desk: #1d1417;        /* panels */
  --rule: #3a2a2f;
  --paper: #f3ece6;       /* main text */
  --mute: #b4a5a8;
  --onair: #ff2e3f;       /* the lamp, live accents */
  --amber: #ffbf3c;       /* numbers */
  --buy: #42e08b; --sell: #ff6b7a;
  --font-display: "Bungee", "Arial Black", Impact, sans-serif;
  --font-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--studio); color: var(--paper); }
body { font: 15px/1.5 var(--font-body); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 60px; display: flex; flex-direction: column; gap: 18px; }

header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand h1 { margin: 0; font: 400 clamp(28px, 6vw, 44px)/1 var(--font-display); letter-spacing: .01em; }
.lamp { font: 400 13px var(--font-display); letter-spacing: .08em; padding: 6px 10px; border-radius: 6px; border: 2px solid #4a2a2f; color: #6d4148; background: #1a0f11; }
.lamp.on { color: #fff; background: var(--onair); border-color: var(--onair); box-shadow: 0 0 18px rgba(255, 46, 63, .65); animation: hum 2.4s ease-in-out infinite; }
@keyframes hum { 50% { box-shadow: 0 0 30px rgba(255, 46, 63, .9); } }
.chip { font: 600 12px var(--font-mono); padding: 5px 9px; border-radius: 999px; border: 1px solid var(--rule); color: var(--mute); }
.chip.live { color: var(--buy); border-color: #2a5a40; }

.booth { background: var(--desk); border: 1px solid var(--rule); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden; }
.who { display: flex; align-items: center; gap: 10px; color: var(--mute); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }
.vu { display: inline-flex; gap: 3px; align-items: flex-end; height: 16px; }
.vu i { width: 4px; background: var(--onair); height: 3px; border-radius: 1px; }
.speaking .vu i { animation: vu .5s ease-in-out infinite alternate; }
.vu i:nth-child(2) { animation-delay: .1s !important; } .vu i:nth-child(3) { animation-delay: .25s !important; } .vu i:nth-child(4) { animation-delay: .05s !important; } .vu i:nth-child(5) { animation-delay: .3s !important; }
@keyframes vu { from { height: 3px; } to { height: 16px; } }
.caption { margin: 0; font: 600 clamp(22px, 3.6vw, 34px)/1.25 var(--font-body); text-wrap: balance; min-height: 3.75em; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.go { background: var(--onair); color: #fff; border: 0; border-radius: 12px; padding: 14px 20px; font: 400 16px var(--font-display); letter-spacing: .04em; }
.go.stop { background: transparent; border: 2px solid var(--onair); color: var(--onair); }
.btn { background: transparent; border: 1px solid var(--rule); border-radius: 10px; padding: 10px 14px; font-weight: 600; font-size: 14px; color: var(--paper); text-decoration: none; display: inline-flex; align-items: center; }
.btn:hover { border-color: var(--mute); }
select { background: var(--studio); border: 1px solid var(--rule); border-radius: 10px; padding: 9px 10px; font-size: 14px; max-width: 220px; }
.note { color: var(--mute); font-size: 13px; margin: 0; }
.err { color: #ffb0b8; }

.grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--desk); border: 1px solid var(--rule); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel h2 { margin: 0; font: 400 16px var(--font-display); letter-spacing: .05em; color: var(--mute); }
.log { display: flex; flex-direction: column; gap: 12px; max-height: 70vh; overflow: auto; }
.line { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; }
.line time { font: 12px var(--font-mono); color: var(--mute); padding-top: 2px; }
.line p { margin: 0; }
.line .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.tag { font: 600 11px var(--font-mono); padding: 2px 7px; border-radius: 6px; background: #2a1d21; color: var(--mute); }
.tag.buy { color: var(--buy); } .tag.sell { color: var(--sell); }
.line.newest p { color: #fff; }
.wire { display: flex; flex-direction: column; }
.trade { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--rule); font-size: 14px; }
.trade:first-child { border-top: 0; }
.trade .side { font: 700 11px var(--font-mono); }
.trade .side.buy { color: var(--buy); } .trade .side.sell { color: var(--sell); }
.trade .what { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trade .what a { color: var(--mute); text-decoration: none; font-size: 12px; }
.trade.star { background: linear-gradient(90deg, rgba(255,191,60,.10), transparent 70%); }
.trade.star .what { color: var(--amber); font-weight: 700; }
.tag.star { color: var(--amber); border: 1px solid #6b5520; }
.trade .amt { font: 600 13px var(--font-mono); color: var(--amber); white-space: nowrap; }
.board { display: flex; flex-direction: column; gap: 6px; }
.board div { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.board b { font: 700 13px var(--font-mono); color: var(--amber); }
.empty { color: var(--mute); font-size: 14px; }

/* Stream mode for OBS / X / Twitch: one big caption */
body.stream .wrap { max-width: none; min-height: 100vh; justify-content: center; padding-inline: 5vw; }
body.stream .grid, body.stream .controls, body.stream .note.hint { display: none; }
body.stream .caption { font-size: clamp(30px, 4.6vw, 64px); }
body.stream .booth { padding: 4vw; }
.overlay { position: fixed; inset: 0; background: rgba(18, 12, 14, .92); display: flex; align-items: center; justify-content: center; z-index: 5; }
.overlay button { font-size: 22px; padding: 22px 30px; }
@media (prefers-reduced-motion: reduce) { .lamp.on, .speaking .vu i { animation: none; } }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="brand">
      <h1>DEGEN RADIO</h1>
      <span class="lamp" id="lamp">ON AIR</span>
    </div>
    <span class="chip" id="mode">connecting…</span>
  </header>

  <section class="booth" id="booth" aria-live="polite">
    <div class="who"><span class="vu" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span id="hostName">DJ Exit Liquidity</span></div>
    <p class="caption" id="caption">Warming up the mic…</p>
    <div class="controls">
      <button class="go" id="listen" type="button">▶ LISTEN LIVE</button>
      <select id="voice" aria-label="Voice"></select>
      <a class="btn" id="share" target="_blank" rel="noopener">Share this line</a>
      <a class="btn" id="streamLink" href="?stream" target="_blank" rel="noopener">Stream mode</a>
    </div>
    <p class="note hint" id="hint">Real trades from 100 famous memecoin traders, roasted live. Turn the sound on.</p>
  </section>

  <div class="grid">
    <section class="panel">
      <h2>TRANSCRIPT</h2>
      <div class="log" id="log"><p class="empty">The show is starting…</p></div>
    </section>
    <div style="display:flex;flex-direction:column;gap:18px;min-width:0">
      <section class="panel">
        <h2>THE WIRE</h2>
        <div class="wire" id="wire"><p class="empty">Waiting for the first trade…</p></div>
      </section>
      <section class="panel">
        <h2>BIGGEST APERS TODAY</h2>
        <div class="board" id="board"><p class="empty">Nobody yet.</p></div>
      </section>
    </div>
  </div>
</main>
<div class="overlay" id="overlay" hidden><button class="go" id="goLive" type="button">▶ GO LIVE</button></div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  const stream = /[?&]stream\b/.test(location.search);
  if (stream) document.body.classList.add("stream");

  let lastId = 0, listening = false, lines = [], tradesById = {}, aiVoice = false;
  const queue = [];
  const tts = "speechSynthesis" in window ? window.speechSynthesis : null;

  // ---------- voice ----------
  const PREFERRED = [/Daniel/i, /Google UK English Male/i, /Microsoft (Guy|Ryan|Christopher|Andrew)/i, /\bAlex\b/i, /Arthur/i, /en-GB/i, /en-US/i];
  function voices() { return tts ? tts.getVoices().filter((v) => /^en/i.test(v.lang)) : []; }
  function fillVoices() {
    const list = voices(), sel = $("voice");
    sel.hidden = aiVoice || !list.length;
    if (!list.length) return;
    const saved = store.get("dr_voice");
    sel.replaceChildren(...list.map((v) => { const o = el("option", null, `${v.name} (${v.lang})`); o.value = v.name; return o; }));
    let pick = list.find((v) => v.name === saved);
    for (const re of PREFERRED) { if (pick) break; pick = list.find((v) => re.test(v.name) || re.test(v.lang)); }
    if (pick) sel.value = pick.name;
  }
  if (tts) { fillVoices(); tts.onvoiceschanged = fillVoices; } else { $("voice").hidden = true; }
  $("voice").onchange = () => store.set("dr_voice", $("voice").value);

  // ---------- speaking: AI voice (MP3 from the server) or the browser's own voice as fallback ----------
  const audio = new Audio();
  audio.preload = "auto";
  const SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=";
  let playing = false, current = null;

  function finish() {
    playing = false; current = null;
    $("booth").classList.remove("speaking");
    setTimeout(speakNext, 250);
  }
  audio.onended = finish;
  audio.onerror = () => {
    if (!listening) return;
    if (current && audio.src.includes("/api/voice")) browserSpeak(current); else finish();
  };

  function browserSpeak(seg) {
    if (!tts) return finish();
    const u = new SpeechSynthesisUtterance(seg.text);
    const v = voices().find((x) => x.name === $("voice").value);
    if (v) u.voice = v;
    u.rate = 1.1; u.pitch = 0.95;
    u.onstart = () => $("booth").classList.add("speaking");
    u.onend = u.onerror = finish;
    tts.speak(u);
  }

  function speakNext() {
    if (!listening || playing || !queue.length) return;
    if (!aiVoice && (!tts || tts.speaking)) return;
    const seg = queue.shift();
    current = seg; playing = true;
    showCaption(seg);
    if (!aiVoice) return browserSpeak(seg);
    audio.src = "/api/voice?id=" + seg.id;
    audio.play().then(() => $("booth").classList.add("speaking")).catch(() => browserSpeak(seg));
    if (queue[0]) fetch("/api/voice?id=" + queue[0].id).catch(() => {}); // get the next line ready
  }

  function setListening(on) {
    listening = on;
    $("lamp").classList.toggle("on", on);
    $("listen").textContent = on ? "■ STOP" : "▶ LISTEN LIVE";
    $("listen").classList.toggle("stop", on);
    if (!on) {
      if (tts) tts.cancel();
      audio.pause();
      queue.length = 0; playing = false; current = null;
      $("booth").classList.remove("speaking");
    }
    if (on) {
      if (!aiVoice && !tts) { $("hint").textContent = "This browser can't speak. Captions only."; return; }
      const latest = lines[lines.length - 1];
      if (latest) queue.push(latest);
      else if (aiVoice) { audio.src = SILENT; audio.play().catch(() => {}); } // unlock audio on phones
      speakNext();
    }
  }
  $("listen").onclick = () => setListening(!listening);
  if (stream) { $("overlay").hidden = false; $("goLive").onclick = () => { $("overlay").hidden = true; setListening(true); }; }

  // ---------- rendering ----------
  const fmtTime = (ts) => new Date(ts * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const fmtMcap = (n) => (n == null ? "" : n >= 1e6 ? `$${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `$${Math.round(n / 1e3)}k` : `$${n}`);

  function showCaption(seg) {
    $("caption").textContent = seg.text;
    const text = `"${seg.text}" — ${seg.host || "DJ Exit Liquidity"} on Degen Radio`;
    $("share").href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(text) + "&url=" + encodeURIComponent(location.origin);
  }

  function renderLog() {
    const box = $("log"); box.replaceChildren();
    if (!lines.length) { box.append(el("p", "empty", "The show is starting…")); return; }
    [...lines].reverse().slice(0, 60).forEach((seg, i) => {
      const row = el("div", "line" + (i === 0 ? " newest" : ""));
      row.append(el("time", null, fmtTime(seg.ts)));
      const body = el("div"); body.append(el("p", null, seg.text));
      const tags = el("div", "tags");
      for (const id of (seg.events || []).slice(0, 6)) {
        const t = tradesById[id]; if (!t) continue;
        tags.append(el("span", "tag " + t.side + (t.star ? " star" : ""), `${t.side === "buy" ? "▲" : "▼"} ${t.star ? "★ " : ""}${t.n} $${t.sym} ${t.sol} SOL`));
      }
      if (tags.childElementCount) body.append(tags);
      row.append(body); box.append(row);
    });
  }

  function renderWire(trades) {
    const box = $("wire"); box.replaceChildren();
    if (!trades.length) { box.append(el("p", "empty", "Waiting for the first trade…")); return; }
    for (const t of trades.slice(0, 18)) {
      const row = el("div", "trade" + (t.star ? " star" : ""));
      row.append(el("span", "side " + t.side, t.side === "buy" ? "BUY" : "SELL"));
      const what = el("span", "what"); what.append(document.createTextNode(`${t.star ? "★ " : ""}${t.n} · $${t.sym} `));
      if (t.mcap) what.append(el("span", "tag", fmtMcap(t.mcap)));
      row.append(what, el("span", "amt", `${t.sol} SOL`));
      box.append(row);
    }
  }

  function renderBoard(today) {
    const box = $("board"); box.replaceChildren();
    const rows = (today?.topApers || []).filter((r) => r.bought > 0);
    if (!rows.length) { box.append(el("p", "empty", "Nobody yet.")); return; }
    rows.forEach((r, i) => { const d = el("div"); d.append(el("span", null, `${i + 1}. ${r.name}`), el("b", null, `${r.bought} SOL`)); box.append(d); });
  }

  // ---------- polling ----------
  let failures = 0;
  async function poll() {
    try {
      const res = await fetch("/api/radio?after=" + lastId, { cache: "no-store" });
      const d = await res.json();
      if (!res.ok) throw new Error(d.error || "offline");
      failures = 0;
      $("hostName").textContent = d.host;
      if (d.speech === "ai" && !aiVoice) { aiVoice = true; $("voice").hidden = true; }
      $("mode").textContent = d.mode === "live" ? "● LIVE TRADES" : d.mode === "demo" ? "DEMO TRADES" : "CONNECTING FEED";
      $("mode").classList.toggle("live", d.mode === "live");
      for (const t of d.trades) tradesById[t.id] = t;
      const first = lastId === 0;
      for (const seg of d.segments) {
        if (seg.id <= lastId) continue;
        lastId = seg.id; lines.push(seg);
        if (!first && listening) queue.push(seg);
      }
      if (lines.length > 200) lines = lines.slice(-200);
      if ((!listening || (!tts && !aiVoice)) && lines.length) showCaption(lines[lines.length - 1]);
      else if (first && lines.length) showCaption(lines[lines.length - 1]);
      renderLog(); renderWire(d.trades); renderBoard(d.today);
      speakNext();
    } catch (e) {
      failures++;
      if (failures > 2) $("caption").textContent = "Signal lost. Reconnecting…";
    } finally {
      setTimeout(poll, document.hidden && !listening ? 20000 : 6000);
    }
  }
  poll();
})();
</script>
</body>
</html>
